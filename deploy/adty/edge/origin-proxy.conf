# 由 deploy/adty/edge/sites/*.conf 通过 include 引入的通用回源与缓存规则。
# 每个 server 块需先定义 set $adty_origin_sni "<fallback_origin>";。

# 防止 HTTP/2 连接复用或伪造 Host 跨站点绕过 SNI 校验。
if ($host != $ssl_server_name) {
    return 421;
}

client_max_body_size 20m;

# 禁止经由边缘节点访问源站内部管理接口。
location ^~ /api/adty/internal/ {
    return 404;
}

# 内容哈希静态资源：跨分站共享缓存 30 天。
location ^~ /static/ {
    proxy_pass https://adty_origin;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header CF-Connecting-IP $remote_addr;
    proxy_set_header CF-IPCountry "CN";
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Accept-Encoding "gzip";
    proxy_ssl_server_name on;
    proxy_ssl_name $adty_origin_sni;
    proxy_ssl_verify on;
    proxy_ssl_trusted_certificate /etc/nginx/adty-edge/cloudflare-origin-ca.pem;
    proxy_ssl_verify_depth 2;

    gunzip on;
    proxy_cache adty_static;
    proxy_cache_key "$scheme$request_uri";
    proxy_cache_valid 200 30d;
    proxy_cache_valid 404 1m;
    proxy_cache_lock on;
    proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
    proxy_ignore_headers Set-Cookie Cache-Control Expires;
    proxy_hide_header Set-Cookie;
    proxy_hide_header Alt-Svc;
    add_header X-Adty-Edge-Cache $upstream_cache_status always;
}

# 分站上传资源（Logo / Favicon）：按 Host 隔离缓存 1 天。
location ^~ /uploads/site-assets/ {
    proxy_pass https://adty_origin;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header CF-Connecting-IP $remote_addr;
    proxy_set_header CF-IPCountry "CN";
    proxy_set_header X-Forwarded-Proto https;
    proxy_ssl_server_name on;
    proxy_ssl_name $adty_origin_sni;
    proxy_ssl_verify on;
    proxy_ssl_trusted_certificate /etc/nginx/adty-edge/cloudflare-origin-ca.pem;
    proxy_ssl_verify_depth 2;

    proxy_cache adty_assets;
    proxy_cache_key "$scheme$host$request_uri";
    proxy_cache_valid 200 1d;
    proxy_cache_valid 404 1m;
    proxy_cache_lock on;
    proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
    proxy_ignore_headers Set-Cookie;
    proxy_hide_header Set-Cookie;
    proxy_hide_header Alt-Svc;
    add_header X-Adty-Edge-Cache $upstream_cache_status always;
}

# 根路径公共品牌图与图标（/logo.png、/adty-world-dots.svg、/favicon*、PWA 图标等）：按 Host 隔离缓存 1 天。
location ~* ^/(?:favicon(?:\.ico|-[0-9]+x[0-9]+\.png)|android-chrome-192x192\.png|android-chrome-512x512\.png|maskable-512x512\.png|mstile-150x150\.png|logo(?:-dark)?\.png|adty-[a-z0-9-]+\.(?:png|svg|ico|webp)|site\.webmanifest)$ {
    proxy_pass https://adty_origin;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header CF-Connecting-IP $remote_addr;
    proxy_set_header CF-IPCountry "CN";
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Accept-Encoding "gzip";
    proxy_ssl_server_name on;
    proxy_ssl_name $adty_origin_sni;
    proxy_ssl_verify on;
    proxy_ssl_trusted_certificate /etc/nginx/adty-edge/cloudflare-origin-ca.pem;
    proxy_ssl_verify_depth 2;

    gunzip on;
    proxy_cache adty_assets;
    proxy_cache_key "$scheme$host$request_uri";
    proxy_cache_valid 200 1d;
    proxy_cache_valid 404 1m;
    proxy_cache_lock on;
    proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
    proxy_ignore_headers Set-Cookie Cache-Control Expires;
    proxy_hide_header Set-Cookie;
    proxy_hide_header Alt-Svc;
    add_header X-Adty-Edge-Cache $upstream_cache_status always;
}

# 同域白标文档构建资源（VitePress /docs/assets/）：带内容哈希，跨主/分站共享缓存 30 天。
location ^~ /docs/assets/ {
    proxy_pass https://adty_origin;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header CF-Connecting-IP $remote_addr;
    proxy_set_header CF-IPCountry "CN";
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Accept-Encoding "gzip";
    proxy_ssl_server_name on;
    proxy_ssl_name $adty_origin_sni;
    proxy_ssl_verify on;
    proxy_ssl_trusted_certificate /etc/nginx/adty-edge/cloudflare-origin-ca.pem;
    proxy_ssl_verify_depth 2;

    gunzip on;
    proxy_cache adty_static;
    proxy_cache_key "$scheme$request_uri";
    proxy_cache_valid 200 30d;
    proxy_cache_valid 404 1m;
    proxy_cache_lock on;
    proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
    proxy_ignore_headers Set-Cookie Cache-Control Expires;
    proxy_hide_header Set-Cookie;
    proxy_hide_header Alt-Svc;
    add_header X-Adty-Edge-Cache $upstream_cache_status always;
}

# 同域白标文档 HTML（/docs/）：按 Host 短期缓存 200 响应，保留分站自定义 docs_url 的 302 跳转与 X-Robots-Tag。
location ^~ /docs/ {
    proxy_pass https://adty_origin;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header CF-Connecting-IP $remote_addr;
    proxy_set_header CF-IPCountry "CN";
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Accept-Encoding "gzip";
    proxy_ssl_server_name on;
    proxy_ssl_name $adty_origin_sni;
    proxy_ssl_verify on;
    proxy_ssl_trusted_certificate /etc/nginx/adty-edge/cloudflare-origin-ca.pem;
    proxy_ssl_verify_depth 2;

    gunzip on;
    proxy_cache adty_assets;
    proxy_cache_key "$scheme$host$request_uri";
    proxy_cache_valid 200 5m;
    proxy_cache_lock on;
    proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
    proxy_ignore_headers Set-Cookie;
    proxy_hide_header Set-Cookie;
    proxy_hide_header Alt-Svc;
    add_header X-Adty-Edge-Cache $upstream_cache_status always;
}

# 首页 HTML、登录与控制台接口：不缓存，带连接数/速率限制直接回源。
location / {
    limit_req zone=adty_edge_req burst=60 nodelay;
    limit_conn adty_edge_conn 40;

    proxy_pass https://adty_origin;
    proxy_http_version 1.1;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Host $host;
    proxy_set_header CF-Connecting-IP $remote_addr;
    proxy_set_header CF-IPCountry "CN";
    proxy_set_header X-Forwarded-Proto https;
    proxy_ssl_server_name on;
    proxy_ssl_name $adty_origin_sni;
    proxy_ssl_verify on;
    proxy_ssl_trusted_certificate /etc/nginx/adty-edge/cloudflare-origin-ca.pem;
    proxy_ssl_verify_depth 2;
    proxy_hide_header Alt-Svc;

    proxy_buffering off;
    proxy_connect_timeout 10s;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
}
