# ADTY AI 香港自建边缘节点 Nginx 主配置（Phase 3），部署说明见 docs/adty/deploy.md 第 12 节。
# 放到边缘节点的 /etc/nginx/nginx.conf。需要 nginx-full（或安装 libnginx-mod-stream）。
# 流量模型：
#   - 443 stream 层做 SNI 嗅探（ssl_preread）并附带 PROXY protocol：
#     1) 平台网站子域名（排除 api-sN.*）和已签发证书的自定义网站域名 → 127.0.0.1:8443（本机 TLS 终结 + 静态缓存 + 回源）
#     2) 尚未签发边缘证书的自定义网站域名 → 127.0.0.1:8445（剥离 PROXY protocol 后 TCP 透传至 Cloudflare）
#     3) 未知域名与 API 域名（api-sN.* 等） → 127.0.0.1:8444（ssl_reject_handshake 直接断开）
#   - 80 仅对白名单网站域名返回 301 HTTPS，其余直接断开（444）。

user www-data;
worker_processes auto;
pid /run/nginx.pid;
error_log /var/log/nginx/error.log warn;
include /etc/nginx/modules-enabled/*.conf;

events {
    worker_connections 4096;
    multi_accept on;
}

stream {
    resolver 1.1.1.1 8.8.8.8 valid=60s ipv6=off;
    resolver_timeout 5s;

    include /etc/nginx/adty-edge/stream-map.conf;

    server {
        listen 443;
        listen [::]:443;
        ssl_preread on;
        proxy_protocol on;
        proxy_connect_timeout 5s;
        proxy_timeout 120s;
        proxy_pass $adty_edge_backend;
    }

    # 剥离外层 PROXY protocol 后将原始 TLS 流透传给 Cloudflare（仅用于尚未签发边缘证书的自定义网站域名）。
    server {
        listen 127.0.0.1:8445 proxy_protocol;
        proxy_protocol off;
        proxy_connect_timeout 5s;
        proxy_timeout 120s;
        proxy_pass $adty_cf_passthrough_target;
    }
}

http {
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # 仅信任本机 stream 层发来的 PROXY protocol，还原大陆访客真实 IP。
    set_real_ip_from 127.0.0.1;
    real_ip_header proxy_protocol;

    # 静态资源压缩（/static/ 开启 gunzip，兼容不支持 gzip 的客户端）。
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # /static/ 为带内容哈希的构建产物，按路径跨分站共享缓存；/uploads/site-assets/ 按 Host 隔离缓存。
    proxy_cache_path /var/cache/nginx/adty-static levels=1:2 keys_zone=adty_static:32m max_size=1g inactive=30d use_temp_path=off;
    proxy_cache_path /var/cache/nginx/adty-assets levels=1:2 keys_zone=adty_assets:16m max_size=512m inactive=7d use_temp_path=off;

    # 基础防滥用限速与并发连接保护（首页与动态请求）。
    limit_req_zone $binary_remote_addr zone=adty_edge_req:20m rate=30r/s;
    limit_conn_zone $binary_remote_addr zone=adty_edge_conn:20m;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # 历史重置密码链接可能仍通过 query 携带凭据，访问日志中剥离 /user/reset 的 query 参数。
    map $uri $adty_log_request {
        default       $request;
        /user/reset   "$request_method $uri $server_protocol";
        /user/reset/  "$request_method $uri $server_protocol";
    }

    log_format adty_edge '$remote_addr - [$time_local] "$host" "$adty_log_request" $status $body_bytes_sent '
                         'cache=$upstream_cache_status rt=$request_time urt=$upstream_response_time';
    access_log /var/log/nginx/access.log adty_edge;

    include /etc/nginx/adty-edge/http80-hosts.conf;
    include /etc/nginx/adty-edge/origin-upstream.conf;

    # 可选：边缘本地 HTTP 80 server 块（如裸域 HTTP-01 证书校验与 301 跳转）。
    include /etc/nginx/adty-edge/http80-extra/*.conf;

    # HTTP 80：只对清单内的网站域名做 301 HTTPS，拒绝开放式重定向和 IP 扫描。
    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        if ($adty_http80_allowed = 1) {
            return 301 https://$host$request_uri;
        }
        return 444;
    }

    # 未知 SNI 或 api-sN.* 域名直接拒绝 TLS 握手，不出示证书。
    server {
        listen 127.0.0.1:8444 ssl proxy_protocol;
        ssl_reject_handshake on;
    }

    server {
        listen 127.0.0.1:8443 ssl http2 default_server proxy_protocol;
        ssl_reject_handshake on;
    }

    # 由 sync-edge.py 自动生成的泛域名与自定义网站域名 server 块。
    include /etc/nginx/adty-edge/sites/*.conf;
}
